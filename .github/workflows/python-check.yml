name: Python syntax check
on:
  push:
    branches: ["main", "feat/azure-economy-dashboard"]
  pull_request:
    branches: ["main"]
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python files
        run: python -m compileall -q main.py cogs commands.py
